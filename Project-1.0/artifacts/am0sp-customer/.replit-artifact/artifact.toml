kind = "web"
previewPath = "/"
title = "AM0SP Customer App"
description = "A private customer web app for AM0SP account access, private file management and media viewing, and account security."
version = "1.0.0"
id = "artifacts/am0sp-customer"
router = "path"

[[services]]
name = "web"
paths = [ "/*" ]
localPort = 25126

[services.development]
run = "pnpm --filter @workspace/am0sp-customer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/am0sp-customer", "run", "build" ]
serve = "static"
publicDir = "artifacts/am0sp-customer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25126"
BASE_PATH = "/"
